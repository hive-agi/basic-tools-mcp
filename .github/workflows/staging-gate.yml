name: staging-gate

# staging is a GATE, not a mirror: a push to staging runs the suite against the
# DECLARED classpath (no local.deps.edn), and only a green staging is promoted
# to main, where release.yml mints the version. This workflow never publishes.
#
# Runs unchanged on GitHub Actions and Gitea Actions: the Clojure CLI comes from
# the official installer, not DeLaGuardo/setup-clojure, whose GitHub API call
# fails under Gitea's GITHUB_TOKEN.
#
# Secrets (optional): MAVEN_USERNAME, MAVEN_TOKEN, for deps served only by the
# private hive-gitea registry.

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: staging-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_TOKEN: ${{ secrets.MAVEN_TOKEN }}
      # Pinned babashka: the exact version bb --version reports locally, and
      # the sha256 of that tag's linux-amd64-static tarball. Pinned because the
      # upstream install script is read from master, a moving target that used
      # to be piped into a root shell. The same two values must stay identical
      # in release.yml and staging-gate.yml.
      BABASHKA_VERSION: "1.13.224"
      BABASHKA_SHA256: "aa55a3a2cacdfc2c8eba38991cdd4ea3d37eadde9ba374f0da0b95ad00daa1ba"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Clojure CLI
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/clj-install.sh \
            https://download.clojure.org/install/linux-install-1.12.4.1618.sh
          chmod +x /tmp/clj-install.sh
          sudo /tmp/clj-install.sh
          clojure --version

      - name: Private-registry credentials
        if: env.MAVEN_TOKEN != ''
        run: |
          CLJ_CONFIG="${CLJ_CONFIG:-${XDG_CONFIG_HOME:+$XDG_CONFIG_HOME/clojure}}"
          CLJ_CONFIG="${CLJ_CONFIG:-$HOME/.clojure}"
          mkdir -p "$CLJ_CONFIG" "$HOME/.m2"
          cat > "$CLJ_CONFIG/deps.edn" <<'EOF'
          {:mvn/repos {"hive-gitea" {:url "https://gitea.hive-mcp.com/api/packages/hive-agi/maven"}}}
          EOF
          cat > "$HOME/.m2/settings.xml" <<EOF
          <settings><servers><server>
            <id>hive-gitea</id>
            <username>${MAVEN_USERNAME}</username>
            <password>${MAVEN_TOKEN}</password>
          </server></servers></settings>
          EOF

      - name: Install ripgrep
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ripgrep
          rg --version

      # The pins must resolve from the registries before anything else is
      # worth running: this is the step a dependency sweep can break.
      - name: Resolve declared classpath
        run: clojure -P

      # The kaocha suite is JVM-only, so the babashka half of the build is
      # invisible to it: bb.edn declares its own :deps and the server runs
      # under bb, and a bump to deps.edn alone once shipped a bb server that
      # resolved one version behind it. Load that path and compare the two
      # declarations here, before the suite.
      - name: Install babashka (pinned, checksum-verified)
        run: |
          set -euo pipefail
          tarball="babashka-${BABASHKA_VERSION}-linux-amd64-static.tar.gz"
          url="https://github.com/babashka/babashka/releases/download/v${BABASHKA_VERSION}/${tarball}"
          curl -fsSL -o "/tmp/${tarball}" "$url"
          # The sha256 is written literally above, taken from the release's
          # published .sha256 file. A mismatch (a retagged or tampered asset)
          # fails here, before anything is extracted or executed.
          echo "${BABASHKA_SHA256}  /tmp/${tarball}" | sha256sum -c -
          tar -xzf "/tmp/${tarball}" -C /tmp
          mkdir -p "$HOME/.local/bin"
          install -m 0755 /tmp/bb "$HOME/.local/bin/bb"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/bb" --version

      - name: Check the babashka classpath
        run: |
          set -euo pipefail
          bb load-check
          bb deps-agree

      - name: Test
        run: |
          set -euo pipefail
          mode=$(clojure -M -e '(let [a (get-in (clojure.edn/read-string (slurp "deps.edn")) [:aliases :test])] (print (cond (:main-opts a) "main" (:exec-fn a) "exec" a "paths" :else "none")))')
          case "$mode" in
            main) clojure -M:test ;;
            exec) clojure -X:test ;;
            # A :test alias that only adds paths: run it under cognitect's runner.
            paths) clojure -Sdeps '{:deps {io.github.cognitect-labs/test-runner {:git/tag "v0.5.1" :git/sha "dfb30dd"}}}' -M:test -m cognitect.test-runner ;;
            *)
              if [ -f bb.edn ] && grep -qE '^\s*test\s' bb.edn; then
                # bb is already on PATH from the pinned install step above.
                bb test
              else
                echo "no runnable :test alias or bb test task; declared classpath resolved"
              fi ;;
          esac
