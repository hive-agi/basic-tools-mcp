name: release

# Patch-bump and publish only when the push actually changes the library.
# README / CI / test-only commits do not mint a version, because a published
# pom is immutable on both Clojars and the private registry.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'resources/**'
      - 'deps.edn'
      # version.edn decides what the jar carries (:src-dirs, :publish),
      # and VERSION is the release floor: both must be able to release.
      - 'version.edn'
      - 'VERSION'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Pinned babashka: the exact version bb --version reports locally, and
      # the sha256 of that tag's linux-amd64-static tarball. Pinned because the
      # upstream install script is read from master, a moving target that used
      # to be piped into a root shell in a job holding contents: write. The same
      # two values must stay identical in release.yml and staging-gate.yml.
      BABASHKA_VERSION: "1.13.224"
      BABASHKA_SHA256: "aa55a3a2cacdfc2c8eba38991cdd4ea3d37eadde9ba374f0da0b95ad00daa1ba"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest

      # The file.search tests shell out to rg; staging-gate.yml installs it
      # too. Without it every release since 2026-09-20 failed in Run tests.
      - name: Install ripgrep
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ripgrep
          rg --version

      # The suite is JVM-only; the babashka server has its own :deps in bb.edn
      # and nothing else loads them. A release that cannot start under bb is not
      # a release, so the same check staging-gate.yml runs gates the mint.
      - name: Install babashka (pinned, checksum-verified)
        run: |
          set -euo pipefail
          tarball="babashka-${BABASHKA_VERSION}-linux-amd64-static.tar.gz"
          url="https://github.com/babashka/babashka/releases/download/v${BABASHKA_VERSION}/${tarball}"
          curl -fsSL -o "/tmp/${tarball}" "$url"
          # The sha256 is written literally above, taken from the release's
          # published .sha256 file. A mismatch (a retagged or tampered asset)
          # fails here, before anything is extracted or executed.
          echo "${BABASHKA_SHA256}  /tmp/${tarball}" | sha256sum -c -
          tar -xzf "/tmp/${tarball}" -C /tmp
          mkdir -p "$HOME/.local/bin"
          install -m 0755 /tmp/bb "$HOME/.local/bin/bb"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/bb" --version

      - name: Check the babashka classpath
        run: |
          set -euo pipefail
          bb load-check
          bb deps-agree

      # A published pom is immutable, so the suite runs BEFORE anything
      # is minted. Without this step a red push straight to main still
      # deploys, and the bad version can never be replaced.
      - name: Run tests
        run: clojure -M:test -m kaocha.runner

      # The release number comes from the tags, not from a commit back to main.
      # VERSION in the tree is a FLOOR (raise it in a staging PR to open a new
      # minor line); this run releases patch+1 of max(VERSION, newest v* tag).
      - name: Resolve release base from tags
        run: |
          set -euo pipefail
          FLOOR=$(tr -d '[:space:]' < VERSION)
          LAST=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n1 | sed 's/^v//')
          BASE=$(printf '%s\n%s\n' "$FLOOR" "${LAST:-$FLOOR}" | sort -V | tail -n1)
          echo "VERSION floor $FLOOR, newest tag ${LAST:-none}: base $BASE"
          printf '%s\n' "$BASE" > VERSION

      - name: Bump patch version
        run: clojure -T:build bump :level :patch

      - name: Tag
        run: |
          set -euo pipefail
          VER=$(tr -d '[:space:]' < VERSION)
          # The server reads its version from the classpath copy; keep it
          # equal to VERSION in the workspace so the jar carries the release
          # (release_parity_test asserts the two match). Not committed.
          cp VERSION resources/basic-tools-mcp/VERSION
          git config user.name  "hive-ci"
          git config user.email "ci@hive-agi.local"
          # Tag only, no commit: a version-bump commit on main is one staging
          # lacks, and it made every next staging->main PR conflict in VERSION.
          # Annotated, so the next run's tag scan and `git describe` see it.
          git tag -a "v$VER" -m "release $VER"
          git push origin "refs/tags/v$VER"

      - name: Deploy
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_DEPLOY_TOKEN }}
        run: clojure -T:build deploy
